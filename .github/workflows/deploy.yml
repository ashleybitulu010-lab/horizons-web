name: Deploy Ash Ledger

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-ashledger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR=/opt/ashledger
            APP_PORT=3000

            cd "$APP_DIR"
            git fetch origin
            git checkout master
            git reset --hard origin/master

            npm install
            node tools/generate-llms.js || true
            npx vite build --outDir dist

            if pm2 describe ashledger >/dev/null 2>&1; then
              pm2 restart ashledger
            else
              pm2 start npx --name ashledger -- vite preview --outDir dist --host 0.0.0.0 --port "$APP_PORT"
            fi
            pm2 save

            sleep 3
            HTTP_CODE=$(curl -sS -o /tmp/ashledger_health_body -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/")
            echo "HTTP_CODE=${HTTP_CODE}"
            head -c 200 /tmp/ashledger_health_body || true
            echo
            test "$HTTP_CODE" = "200"
