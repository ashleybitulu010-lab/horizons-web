name: Deploy Ash Ledger

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-ashledger-production
  cancel-in-progress: true

jobs:
  deploy:
    # Runs on the VPS itself (GitHub-hosted runners cannot reach this Hostinger SSH port).
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Build static app, reload nginx, verify HTTP 200
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://knrwplidgvuvjnuqqmrt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: bash tools/deploy-vps.sh
