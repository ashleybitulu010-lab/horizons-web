name: Deploy Ash Ledger

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-ashledger-production
  cancel-in-progress: true

jobs:
  deploy:
    # Runs on the VPS itself (GitHub-hosted runners cannot reach this Hostinger SSH port).
    runs-on: [self-hosted, ashledger]
    timeout-minutes: 20
    steps:
      - name: Build static app, reload nginx, verify HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:$HOME/.npm-global/bin:$PATH"
          APP_DIR=/opt/ashledger
          APP_PORT=3000

          cd "$APP_DIR"
          git config --global --add safe.directory "$APP_DIR" || true
          git fetch origin
          git checkout master
          git reset --hard origin/master

          npm install
          node tools/generate-llms.js || true

          # Build beside the live directory, then swap it atomically. Some
          # legacy assets can be owned by another deployment user, so asking
          # Vite to empty the live directory can fail with EACCES.
          BUILD_DIR=$(mktemp -d "$APP_DIR/.dist-build-XXXXXX")
          BACKUP_DIR="$APP_DIR/.dist-backup-${GITHUB_RUN_ID}"
          trap 'rm -rf "${BUILD_DIR:-}" 2>/dev/null || true' EXIT
          npx vite build --outDir "$BUILD_DIR"

          if [ -d "$APP_DIR/dist" ]; then
            mv "$APP_DIR/dist" "$BACKUP_DIR"
          fi
          if ! mv "$BUILD_DIR" "$APP_DIR/dist"; then
            [ -d "$BACKUP_DIR" ] && mv "$BACKUP_DIR" "$APP_DIR/dist"
            exit 1
          fi
          BUILD_DIR=""
          rm -rf "$BACKUP_DIR" 2>/dev/null || echo "WARN: previous dist could not be removed"

          # nginx serves /opt/ashledger/dist directly — rebuild is enough (no process restart).
          # Keep PM2 fallback only if nginx/PocketBase stack is not present.
          if ! curl -fsS "http://127.0.0.1:${APP_PORT}/hcgi/platform/api/health" >/dev/null 2>&1; then
            if pm2 describe ashledger >/dev/null 2>&1; then
              pm2 restart ashledger
            else
              pm2 start npx --name ashledger -- vite preview --outDir dist --host 0.0.0.0 --port "$APP_PORT"
            fi
            pm2 save
          fi

          sleep 2
          HTTP_CODE=$(curl -sS -o /tmp/ashledger_health_body -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/")
          echo "HTTP_CODE=${HTTP_CODE}"
          head -c 200 /tmp/ashledger_health_body || true
          echo
          test "$HTTP_CODE" = "200"

          PB_CODE=$(curl -sS -o /tmp/pb_health_body -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/hcgi/platform/api/health" || true)
          echo "PB_CODE=${PB_CODE}"
          head -c 200 /tmp/pb_health_body || true
          echo
          # Soft-check: do not fail deploy if PB briefly restarts
          if [ "$PB_CODE" != "200" ]; then
            echo "WARN: PocketBase proxy health returned ${PB_CODE}"
          fi
